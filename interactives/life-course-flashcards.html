<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Life Course Flashcards</title>
    <style>
      :root {
        --ink: #183247;
        --navy: #163d5a;
        --teal: #347d73;
        --gold: #d4a62a;
        --line: #c8d9df;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 24px;
        font:
          16px/1.55 Arial,
          sans-serif;
        color: var(--ink);
        background: #f3f7f8;
      }
      h1 {
        text-align: center;
        font-family: Georgia, serif;
        color: var(--navy);
        margin: 0.2rem 0;
      }
      .intro {
        text-align: center;
        max-width: 760px;
        margin: 0 auto 22px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 20px;
        max-width: 1100px;
        margin: auto;
      }
      .card {
        height: 410px;
        perspective: 1000px;
        border: 0;
        background: transparent;
        padding: 0;
        text-align: inherit;
        cursor: pointer;
      }
      .inner {
        position: relative;
        width: 100%;
        height: 100%;
        transition: transform 0.6s;
        transform-style: preserve-3d;
      }
      .card[aria-pressed="true"] .inner {
        transform: rotateY(180deg);
      }
      .face {
        position: absolute;
        inset: 0;
        backface-visibility: hidden;
        border-radius: 15px;
        overflow: hidden;
        box-shadow: 0 5px 14px rgba(24, 50, 71, 0.18);
        background: #fff;
        border: 1px solid var(--line);
        padding: 18px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .front {
        border-top: 7px solid var(--teal);
      }
      .back {
        transform: rotateY(180deg);
        justify-content: center;
        overflow: auto;
        border-top: 7px solid var(--gold);
        align-items: flex-start;
      }
      .back h2 {
        align-self: center;
      }
      .front img {
        width: 100%;
        height: 255px;
        object-fit: cover;
        object-position: center;
        border-radius: 9px;
      }
      h2 {
        font-size: 1.15rem;
        text-align: center;
        line-height: 1.3;
      }
      .hint {
        font-size: 0.85rem;
        color: #58707c;
        margin-top: auto;
      }
      @media (prefers-reduced-motion: reduce) {
        .inner {
          transition: none;
        }
      }
      @media print {
        .card {
          height: auto;
        }
        .inner {
          transform: none !important;
        }
        .face {
          position: relative;
          transform: none;
          backface-visibility: visible;
          margin-bottom: 8px;
        }
        .hint {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <h1>Socialization Across the Life Course</h1>
    <p class="intro">
      Select a card to reveal how society defines and organizes that stage.
      Select it again to return. Keyboard users can press Enter or Space.
    </p>
    <div class="grid" id="cards"></div>
    <script>
      const data = [
        [
          "../images/life-course-childhood.webp",
          "Childhood (birth–12)",
          "Earlier societies often treated children as miniature adults who worked or apprenticed. Industrialization, schooling laws, developmental science, and child-protection movements helped construct the modern expectation that childhood should include education, care, play, guidance, and protection.",
        ],
        [
          "../images/life-course-adolescence.webp",
          "Adolescence (13–17)",
          "Adolescence expanded as industrial economies required more schooling and allowed many young people to remain outside full-time labor. Biology matters, but laws, schools, peer cultures, media, and families organize what adolescence means.",
        ],
        [
          "../images/life-course-transition-adulthood.webp",
          "Transitional adulthood (18–29)",
          "Extended education, housing costs, changing work, and delayed marriage or parenthood have made the transition to established adult roles longer and less uniform for many people. Class and family resources strongly affect available choices.",
        ],
        [
          "../images/life-course-early-middle.webp",
          "Early middle years (30–49)",
          "Work, caregiving, relationships, and community roles often intensify. Divorce, job loss, parenthood, disability, or migration may require resocialization. There is no single correct timetable.",
        ],
        [
          "../images/life-course-later-middle.webp",
          "Later middle years (50–65)",
          "People may reassess work, family, health, identity, and future plans. Experiences vary by health, occupation, social class, culture, discrimination, and access to resources.",
        ],
        [
          "../images/life-course-older.webp",
          "Older years (65+)",
          "Retirement rules, medicine, family structure, and cultural beliefs shape later life. Social connection supports well-being, while ageism can wrongly treat older adults as one dependent category.",
        ],
        [
          "../images/life-course-advanced-age.webp",
          "Advanced older age",
          "Some people experience increasing frailty or caregiving needs, while others remain independent. Dignity, autonomy, accessible communities, meaningful roles, and social connection remain important at every age.",
        ],
      ];
      const root = document.getElementById("cards");
      data.forEach((x, i) => {
        const b = document.createElement("button");
        b.className = "card";
        b.type = "button";
        b.setAttribute("aria-pressed", "false");
        b.setAttribute("aria-label", x[1] + ". Select to reveal explanation.");
        b.innerHTML = `<span class="inner"><span class="face front"><img src="${x[0]}" alt="Illustration representing ${x[1]}"><h2>${x[1]}</h2><span class="hint">Select to reveal</span></span><span class="face back"><h2>${x[1]}</h2><span>${x[2]}</span><span class="hint">Select to return</span></span></span>`;
        b.addEventListener("click", () =>
          b.setAttribute(
            "aria-pressed",
            b.getAttribute("aria-pressed") !== "true",
          ),
        );
        root.appendChild(b);
      });
    </script>
  </body>
</html>
